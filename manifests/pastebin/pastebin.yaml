apiVersion: v1
kind: Namespace
metadata:
  name: pastebin
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path-retain
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  namespace: pastebin
  name: pastebin-pvc
spec:
  storageClassName: local-path-retain
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pastebin
  name: pastebin
  namespace: pastebin
spec:
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: pastebin
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: pastebin
    spec:
      containers:
      - image: ghcr.io/samihda/pastebin:latest
        imagePullPolicy: IfNotPresent
        name: pastebin
        livenessProbe:
          httpGet:
            path: /livez
            port: 8000
          initialDelaySeconds: 3
          periodSeconds: 30
        ports:
        - containerPort: 8000
          name: pastebin-http
          protocol: TCP
        env:
        - name: PASTEBIN_ROOT
          value: "/var/www"
        volumeMounts:
        - mountPath: /var/www
          name: pastebin-storage
      volumes:
      - name: pastebin-storage
        persistentVolumeClaim:
          claimName: pastebin-pvc
---
apiVersion: v1
kind: Service
metadata:
  namespace: pastebin
  name: pastebin
  labels:
    app: pastebin
spec:
  ports:
  - name: pastebin-http
    protocol: TCP
    port: 80
    targetPort: 8000
  selector:
    app: pastebin
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: pastebin-stripprefix
  namespace: pastebin
spec:
  stripPrefix:
    prefixes:
      - /pastebin
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pastebin-ingress
  namespace: pastebin
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: pastebin-pastebin-stripprefix@kubernetescrd
spec:
  rules:
  - host: "pastebin.home.arpa"
    http:
      paths:
      - pathType: Prefix
        path: /pastebin
        backend:
          service:
            name: pastebin
            port:
              number: 80
